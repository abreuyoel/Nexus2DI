name: Deploy Production

# Se dispara con push a la rama main
on:
  push:
    branches: [main]

jobs:
  deploy-prod:
    # Corre en el runner instalado en el servidor (no necesita SSH externo)
    runs-on: self-hosted

    steps:
      - name: Checkout rama main
        uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # ── Backend ──────────────────────────────────────────────────────────
      - name: Build backend :latest
        run: |
          docker build -t ghcr.io/abreuyoel/nexus2di-backend:latest ./backend

      - name: Push backend :latest
        run: |
          docker push ghcr.io/abreuyoel/nexus2di-backend:latest

      - name: Rollout backend producción
        run: |
          kubectl rollout restart deployment/nexus2di-backend
          kubectl rollout status deployment/nexus2di-backend --timeout=180s

      # ── Frontend ─────────────────────────────────────────────────────────
      - name: Build frontend :latest
        run: |
          docker build -t ghcr.io/abreuyoel/nexus2di-frontend:latest ./frontend

      - name: Push frontend :latest
        run: |
          docker push ghcr.io/abreuyoel/nexus2di-frontend:latest

      - name: Rollout frontend producción
        run: |
          kubectl rollout restart deployment/nexus2di-frontend
          kubectl rollout status deployment/nexus2di-frontend --timeout=60s

      - name: Resumen del deploy
        run: |
          echo "✅ Producción deploy completado"
          echo "🌐 URL: https://www.nexus2di.net"
          kubectl get pods
