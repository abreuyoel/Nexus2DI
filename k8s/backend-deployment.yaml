apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus2di-backend
spec:
  # Fase C de la migración a Redis pub/sub (2026-08-04): antes esto estaba
  # fijo en 1 réplica porque app/websockets/manager.py guardaba las
  # conexiones WebSocket en memoria de un solo proceso -- un evento emitido
  # en un pod nunca llegaba a un cliente conectado a otro. Ya se validó
  # (Fase A en producción real, Fase B con 2 procesos contra Redis
  # desechable) que el pub/sub sobre Redis resuelve eso, así que ahora es
  # seguro subir réplicas. --workers sigue en 1 por ahora (ver Dockerfile):
  # se sube un eje por vez y se mide antes del siguiente.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: nexus2di-backend }
  template:
    metadata:
      labels: { app: nexus2di-backend }
    spec:
      # Kubernetes inyecta automáticamente variables tipo {SVC}_PORT (formato
      # "tcp://IP:PUERTO") para CADA Service que exista en el namespace —
      # incluyendo el "redis" del otro proyecto (epran_backend), que comparte
      # este mismo namespace "default". Esa var choca de nombre con
      # REDIS_PORT que espera esta app (config.py, como int) y tumbaba el
      # arranque con un error de validación de pydantic. Esta app no usa
      # descubrimiento de servicios por env vars (llama a los Services por
      # nombre DNS directo), así que se desactiva por completo.
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
      containers:
        - name: nexus2di-backend
          image: ghcr.io/abreuyoel/nexus2di-backend:latest
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: nexus2di-backend-config }
            - secretRef: { name: nexus2di-backend-secret }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            # Con timeoutSeconds=5 y failureThreshold=5 (100s de margen) el
            # pod SIGUIÓ reiniciándose bajo carga real -- /health (async,
            # no toca la DB) tardó más de 100s seguidos en responder. Con
            # --workers 1 el proceso es un único intérprete: los endpoints
            # sync pesados (resumen-dia agregando en Python, export a Excel
            # con pandas, etc.) corren en threads del threadpool de Starlette
            # pero siguen serializados entre sí por el GIL mientras hacen
            # trabajo CPU-bound, y eso alcanza a bloquear también el loop
            # async que atendería /health. Reiniciar el pod en ese momento es
            # lo peor posible: con 1 sola réplica, cada reinicio es ~10-15s de
            # caída total para TODOS mientras recalienta el pool de conexiones
            # -- y el proceso, aunque lento, sí termina respondiendo (los
            # logs muestran 200 OK después de la demora). Se sube el margen
            # a 5 minutos continuos sin respuesta antes de reiniciar: eso ya
            # sería un deadlock real, no un pico de tráfico. La causa de raíz
            # (contención de GIL bajo --workers 1) queda pendiente aparte.
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            # Más pesado que un backend Node equivalente: pandas/opencv/
            # scikit-learn quedan cargados en memoria del proceso.
            #
            # Subido de nuevo a "4"/"2Gi" (2026-08-04): primer intento de
            # --workers 2 (ver Dockerfile) salió mal porque este límite
            # seguía en "2" -- pensado para 1 solo proceso -- así que los
            # 2 workers de cada pod terminaban compitiendo por el mismo
            # techo de CPU en vez de tener cada uno margen real (más
            # fallos bajo carga, no menos). El nodo tiene de sobra (nunca
            # pasó de ~6% de uso en todas las pruebas de esta sesión), así
            # que se sube proporcional a la cantidad de workers -- 2 cores
            # por worker, memoria también al doble por el mismo motivo
            # (cada worker es un intérprete Python separado con su propia
            # copia de pandas/opencv/scikit-learn en memoria).
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "4", memory: "2Gi" }
---
apiVersion: v1
kind: Service
metadata:
  # ClusterIP puro — sin tipo LoadBalancer, sin hostname público propio en
  # Cloudflare. Solo alcanzable desde dentro del clúster (el nginx del
  # frontend). Ni siquiera /docs o /openapi.json quedan expuestos a internet.
  name: nexus2di-backend-svc
spec:
  selector: { app: nexus2di-backend }
  ports:
    - port: 8000
      targetPort: 8000
