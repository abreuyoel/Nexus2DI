apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus2di-frontend
  namespace: qa
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: nexus2di-frontend }
  template:
    metadata:
      labels: { app: nexus2di-frontend }
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
      containers:
        - name: nexus2di-frontend
          # Imagen con tag :qa — construida desde la rama qa
          image: ghcr.io/abreuyoel/nexus2di-frontend:qa
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  # Este service es el destino de la ruta Cloudflare Tunnel qa.nexus2di.net
  # → http://nexus2di-frontend-svc.qa.svc.cluster.local:8080
  name: nexus2di-frontend-svc
  namespace: qa
spec:
  selector: { app: nexus2di-frontend }
  ports:
    - port: 8080
      targetPort: 8080
