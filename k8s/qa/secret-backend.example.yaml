# Plantilla — el Secret real NUNCA se commitea. Créalo en el servidor con:
#
#   kubectl -n qa create secret generic nexus2di-backend-secret \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 64)" \
#     --from-literal=DB_USER='dev' \
#     --from-literal=DB_PASSWORD='<misma contraseña de producción>' \
#     --from-literal=AZURE_STORAGE_CONNECTION_STRING='<connection string>' \
#     --from-literal=REDIS_PASSWORD='<misma redis password de producción>' \
#     --from-literal=VAPID_PRIVATE_KEY='' \
#     --from-literal=VAPID_PUBLIC_KEY=''
#
# Para verificar que quedó creado:
#   kubectl -n qa get secret nexus2di-backend-secret
apiVersion: v1
kind: Secret
metadata:
  name: nexus2di-backend-secret
  namespace: qa
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME"
  DB_USER: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  AZURE_STORAGE_CONNECTION_STRING: "CHANGE_ME"
  VAPID_PRIVATE_KEY: ""
  VAPID_PUBLIC_KEY: ""
  REDIS_PASSWORD: "CHANGE_ME"
