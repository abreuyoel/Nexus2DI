apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus2di-backend-config
data:
  DB_DRIVER: "ODBC Driver 17 for SQL Server"
  DB_SERVER: "172.174.41.110"
  DB_NAME: "epran"
  # Ajustado de nuevo (2026-08-04, al subir --workers 1->2 en el Dockerfile):
  # con 2 réplicas x 2 workers = 4 procesos, mantener 20+30 por proceso
  # hubiera dado 200 conexiones totales a SQL Server -- sin evidencia de
  # que haga falta tanto. Se baja a 10+15=25 por proceso x 4 = 100
  # conexiones totales, el mismo techo ya validado en producción real
  # (antes 20+30 x 2 réplicas x 1 worker = 100). Si hace falta más
  # throughput de BD, subir viendo antes que la BD realmente lo necesite
  # (con las pruebas de esta sesión, el cuello de botella no era la BD --
  # respondía en milisegundos incluso a 200 consultas concurrentes -- sino
  # contención de CPU/GIL en un solo proceso).
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "15"
  ENVIRONMENT: "production"
  ACCESS_TOKEN_EXPIRE_MINUTES: "480"
  FRONTEND_URL: "https://www.nexus2di.net"
  AZURE_CONTAINER_NAME: "epran"
  AZURE_ACCOUNT_NAME: "saeprandat001"
  SCHEDULER_INTERVAL_MINUTES: "60"
  SCHEDULER_TIMEZONE: "America/Caracas"
  # Fase A de la migración de WebSocket a pub/sub (ver plan de migración):
  # mismo Redis que ya usa epran_backend (Service "redis" en este namespace),
  # pero en una DB lógica separada (1, epran_backend usa la 0) para no
  # chocar con su tráfico de socket.io/BullMQ. REDIS_PASSWORD va en el
  # Secret, no acá.
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "1"
