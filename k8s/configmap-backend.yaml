apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus2di-backend-config
data:
  DB_DRIVER: "ODBC Driver 17 for SQL Server"
  DB_SERVER: "172.174.41.110"
  DB_NAME: "epran"
  # Subido (2026-08-04, incidente en hora pico con 2 réplicas): 5+10=15 por
  # proceso se agotaba bajo carga real -- "QueuePool limit of size 5
  # overflow 10 reached, connection timed out" en los dos pods, eso era el
  # login caído. kubectl top nodes mostraba 6% CPU / 35% memoria -- sobraba
  # margen de sobra, el cuello de botella era solo este límite artificial.
  # 20+30=50 por proceso x 2 réplicas = 100 conexiones totales a SQL
  # Server, muy por debajo de cualquier límite real de la instancia.
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "30"
  ENVIRONMENT: "production"
  ACCESS_TOKEN_EXPIRE_MINUTES: "480"
  FRONTEND_URL: "https://www.nexus2di.net"
  AZURE_CONTAINER_NAME: "epran"
  AZURE_ACCOUNT_NAME: "saeprandat001"
  SCHEDULER_INTERVAL_MINUTES: "60"
  SCHEDULER_TIMEZONE: "America/Caracas"
  # Fase A de la migración de WebSocket a pub/sub (ver plan de migración):
  # mismo Redis que ya usa epran_backend (Service "redis" en este namespace),
  # pero en una DB lógica separada (1, epran_backend usa la 0) para no
  # chocar con su tráfico de socket.io/BullMQ. REDIS_PASSWORD va en el
  # Secret, no acá.
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "1"
