apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus2di-backend-config
data:
  DB_DRIVER: "ODBC Driver 17 for SQL Server"
  DB_SERVER: "172.174.41.110"
  DB_NAME: "epran"
  # Revertido a 20+30 (2026-08-04, mismo día): se había bajado a 10+15 al
  # subir --workers a 2, pero ese cambio se revirtió (ver Dockerfile --
  # empeoró bajo carga real, faltaba subir el límite de CPU del pod antes
  # de sumar workers). Con 2 réplicas x 1 worker = 2 procesos de nuevo,
  # 20+30 por proceso = 100 conexiones totales, el valor ya validado en
  # producción real durante el incidente de hora pico de esta sesión.
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "30"
  ENVIRONMENT: "production"
  ACCESS_TOKEN_EXPIRE_MINUTES: "480"
  FRONTEND_URL: "https://www.nexus2di.net"
  AZURE_CONTAINER_NAME: "epran"
  AZURE_ACCOUNT_NAME: "saeprandat001"
  SCHEDULER_INTERVAL_MINUTES: "60"
  SCHEDULER_TIMEZONE: "America/Caracas"
  # Fase A de la migración de WebSocket a pub/sub (ver plan de migración):
  # mismo Redis que ya usa epran_backend (Service "redis" en este namespace),
  # pero en una DB lógica separada (1, epran_backend usa la 0) para no
  # chocar con su tráfico de socket.io/BullMQ. REDIS_PASSWORD va en el
  # Secret, no acá.
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "1"
